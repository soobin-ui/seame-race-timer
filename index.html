<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 SEA:ME HACKATHON · RACE CONTROL</title>
<style>
  :root{
    /* poster palette → light base */
    --navy-950:#081532; --navy-900:#0c2046; --navy-800:#123059; --navy-700:#1a3d6e;
    --blue-600:#1456e8; --blue-500:#2b6dff; --blue-400:#4f8aff;
    --cyan-400:#1ec8ff; --cyan-300:#62dcff; --cyan-glow:rgba(30,200,255,.45);
    --ink:#102342; --muted:#5c6f8f; --line:#d9e3f2; --line-2:#c4d4ea;
    --bg:#edf2f9; --card:#ffffff;
    --gold:#f5a623; --silver:#98a6b8; --bronze:#d97b3f;
    --danger:#e8453a; --green:#19b56a; --purple:#8b5cf6;
    --shadow:0 14px 40px rgba(12,32,70,.10);
    --radius:14px;
    --display:'Bahnschrift','Arial Narrow','Segoe UI',sans-serif;
    --mono:'Cascadia Mono','Consolas',ui-monospace,Menlo,monospace;
    --body:'Pretendard','Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--body);color:var(--ink);
    background:
      linear-gradient(rgba(20,86,232,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(20,86,232,.035) 1px,transparent 1px),
      radial-gradient(900px 380px at 80% -5%, rgba(30,200,255,.12), transparent),
      radial-gradient(900px 380px at 10% -5%, rgba(43,109,255,.10), transparent),
      var(--bg);
    background-size:28px 28px,28px 28px,auto,auto,auto;
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  h1{margin:0;} button{font-family:inherit;cursor:pointer;border:none;} input,select{font-family:inherit;}

  /* ============ HEADER : poster glitch band ============ */
  .hero{
    position:relative;color:#fff;overflow:hidden;
    background:
      radial-gradient(700px 280px at 85% 20%, rgba(30,200,255,.25), transparent),
      radial-gradient(500px 240px at 8% 80%, rgba(79,138,255,.28), transparent),
      linear-gradient(120deg,var(--navy-950) 0%,var(--navy-900) 55%,var(--navy-800) 100%);
    padding:12px 24px 10px;text-align:center;
  }
  .hero::before{ /* diagonal speed lines */
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
    background:repeating-linear-gradient(115deg,transparent 0 90px,rgba(255,255,255,.028) 90px 92px);
  }
  .hero .title{
    font-family:var(--display);font-stretch:condensed;font-weight:800;
    font-size:clamp(38px,5.6vw,64px);letter-spacing:3px;line-height:1.02;
    text-transform:uppercase;
    text-shadow:3px 3px 0 rgba(30,200,255,.55), -2px -2px 0 rgba(43,109,255,.4);
  }
  .hero .title .colon{color:var(--cyan-400);}
  .hero .title .yr{
    color:var(--cyan-300);
    text-shadow:3px 3px 0 rgba(43,109,255,.5), -2px -2px 0 rgba(30,200,255,.35);
  }
  .hero .tagline{
    margin-top:8px;font-size:clamp(12px,1.4vw,15px);font-weight:600;color:#cfe4ff;letter-spacing:.5px;
  }
  .hero .tagline b{color:var(--cyan-300);}
  /* checkered finish strip */
  .checker{
    height:14px;
    background:
      conic-gradient(var(--navy-950) 90deg,#fff 90deg 180deg,var(--navy-950) 180deg 270deg,#fff 270deg) 0 0/14px 14px;
    border-bottom:3px solid var(--blue-600);
  }

  /* ============ TOOLBAR (양옆 정렬) ============ */
  .toolbar{
    display:flex;gap:10px;flex-wrap:wrap;
    margin:12px auto 0;max-width:2240px;padding:0 18px;
  }
  .toolbar button{
    flex:1 1 130px;
    background:var(--card);border:1px solid var(--line-2);color:var(--navy-700);
    padding:11px 12px;border-radius:10px;font-weight:700;font-size:14px;white-space:nowrap;
    box-shadow:0 2px 8px rgba(12,32,70,.06);transition:.15s;
  }
  .toolbar button:hover{border-color:var(--blue-400);color:var(--blue-600);transform:translateY(-1px);}
  .toolbar button.primary{
    background:linear-gradient(120deg,var(--blue-600),var(--cyan-400));color:#fff;border:none;
    box-shadow:0 6px 18px rgba(20,86,232,.35);
  }
  .toolbar button.primary:hover{filter:brightness(1.07);color:#fff;}
  .toolbar button.gold{flex:1.5 1 180px;}
  .toolbar button.danger{color:var(--danger);}
  .toolbar button.danger:hover{border-color:#f3b3ae;background:#fff5f4;color:var(--danger);}

  /* ============ LAYOUT ============ */
  .wrap{
    max-width:2240px;margin:12px auto 18px;padding:0 18px;
    display:grid;grid-template-columns:440px 1fr;gap:18px;align-items:stretch;
  }
  .control-card,.ranking-card{display:flex;flex-direction:column;min-height:0;}
  /* 화면이 좁아지면 세로로 스택 (좌우 짤림 방지) */
  @media(max-width:1040px){
    .wrap{grid-template-columns:1fr;min-height:0;}
  }
  .card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line);overflow:hidden;
  }
  .kerb{ /* racing kerb stripe */
    height:8px;
    background:repeating-linear-gradient(-45deg,var(--blue-600) 0 14px,var(--navy-900) 14px 28px);
  }
  .card-h{
    display:flex;align-items:center;gap:10px;
    padding:11px 16px 2px;
    font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:2px;color:var(--navy-800);
    text-transform:uppercase;
  }
  .card-h .flag{
    width:14px;height:14px;border-radius:3px;
    background:conic-gradient(var(--navy-900) 90deg,#fff 90deg 180deg,var(--navy-900) 180deg 270deg,#fff 270deg) 0 0/7px 7px;
    border:1px solid var(--navy-900);
  }

  /* ============ STOPWATCH console ============ */
  .sw-body{padding:8px 14px 10px;}
  .sw-screen{
    position:relative;border-radius:12px;padding:22px 12px 20px;text-align:center;
    background:
      radial-gradient(380px 140px at 50% 0%, rgba(30,200,255,.16), transparent),
      linear-gradient(160deg,var(--navy-950),var(--navy-900));
    border:1px solid var(--navy-700);
    box-shadow:inset 0 0 30px rgba(0,0,0,.35), 0 8px 22px rgba(12,32,70,.18);
  }
  .sw-screen::after{ /* carbon texture */
    content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(45deg,transparent 0 3px,rgba(255,255,255,.022) 3px 6px);
  }
  /* F1 start lights */
  .lights{display:flex;gap:9px;justify-content:center;margin-bottom:14px;}
  .lights i{
    width:13px;height:13px;border-radius:50%;
    background:#1c2c52;border:1px solid #29407a;transition:.25s;
  }
  body.sw-on .lights i{
    background:var(--green);border-color:#34d68b;
    box-shadow:0 0 10px rgba(25,181,106,.8);
    animation:pulse 1s infinite alternate;
  }
  body.sw-on .lights i:nth-child(2){animation-delay:.12s}
  body.sw-on .lights i:nth-child(3){animation-delay:.24s}
  body.sw-on .lights i:nth-child(4){animation-delay:.36s}
  body.sw-on .lights i:nth-child(5){animation-delay:.48s}
  @keyframes pulse{from{opacity:.55}to{opacity:1}}
  .sw-time{
    font-family:var(--mono);font-weight:700;font-size:48px;letter-spacing:1px;
    color:var(--cyan-300);text-shadow:0 0 18px var(--cyan-glow);
  }
  .sw-time .cs{font-size:30px;color:var(--blue-400);}
  .sw-label{
    font-family:var(--display);font-size:11px;letter-spacing:4px;color:#7d97c8;
    text-transform:uppercase;margin-top:6px;
  }
  .sw-btns{display:flex;gap:8px;justify-content:center;margin-top:16px;position:relative;z-index:1;}
  .sw-btns button{
    padding:10px 0;width:96px;border-radius:9px;font-weight:800;font-size:14px;color:#fff;
    font-family:var(--display);letter-spacing:2px;text-transform:uppercase;transition:.15s;
  }
  .btn-reset{background:#233c6e;border:1px solid #355291;color:#bcd0f2;}
  .btn-reset:hover{background:#2b4983;}
  .btn-start{background:linear-gradient(120deg,var(--green),#15d182);box-shadow:0 4px 14px rgba(25,181,106,.4);}
  .btn-stop{background:linear-gradient(120deg,var(--danger),#ff6a5c);box-shadow:0 4px 14px rgba(232,69,58,.4);}
  .sw-btns button:hover{filter:brightness(1.08);}
  .sw-hint{margin-top:9px;font-size:11px;color:var(--muted);text-align:center;}
  .sw-hint kbd{
    font-family:var(--mono);font-size:10px;background:#fff;border:1px solid var(--line-2);
    border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--navy-700);
  }

  .apply{margin-top:14px;border-top:1px dashed var(--line-2);padding-top:13px;}
  .apply .ttl{
    font-family:var(--display);font-size:11px;font-weight:700;color:var(--blue-600);
    letter-spacing:2px;margin-bottom:8px;text-transform:uppercase;
  }
  .apply select{
    width:100%;padding:10px;border-radius:9px;border:1px solid var(--line-2);background:#fbfdff;
    color:var(--ink);font-size:13px;margin-bottom:8px;
  }
  .apply .slot{display:flex;gap:6px;}
  .apply .slot button{
    flex:1;padding:10px;border-radius:9px;border:1px solid var(--line-2);background:#fff;
    color:var(--navy-700);font-weight:700;font-size:12px;transition:.15s;
  }
  .apply .slot button:hover{border-color:var(--blue-400);color:var(--blue-600);background:#f4f8ff;}

  /* ============ ADD ENTRY ============ */
  .form-body{padding:9px 16px 11px;}
  .field{margin-bottom:11px;}
  .field label{
    display:block;font-family:var(--display);font-size:10px;font-weight:700;
    letter-spacing:2px;color:var(--navy-700);margin-bottom:5px;text-transform:uppercase;
  }
  .field input{
    width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line-2);
    background:#fbfdff;font-size:14px;color:var(--ink);transition:.15s;
  }
  .field input:focus{outline:none;border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(43,109,255,.15);background:#fff;}
  .field input.err{border-color:var(--danger);background:#fff6f5;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .add-btn{
    width:100%;margin-top:3px;padding:13px;border-radius:10px;color:#fff;font-weight:800;font-size:15px;
    font-family:var(--display);letter-spacing:3px;text-transform:uppercase;
    background:linear-gradient(120deg,var(--blue-600),var(--cyan-400));
    box-shadow:0 6px 18px rgba(20,86,232,.3);transition:.15s;
  }
  .add-btn:hover{filter:brightness(1.07);transform:translateY(-1px);}
  .form-msg{font-size:12px;color:var(--danger);margin-top:8px;min-height:15px;font-weight:600;}

  /* ============ PODIUM ============ */
  .podium{
    display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;
    padding:8px 18px 2px;
  }
  .podium .pcard{
    position:relative;border-radius:14px;padding:14px 14px 13px;text-align:center;overflow:hidden;
    border:1px solid var(--line);background:linear-gradient(180deg,#fff,#f6f9ff);
    animation:rise .5s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .podium .pcard.p1{
    border:1px solid rgba(245,166,35,.6);
    background:linear-gradient(180deg,#fffdf5,#fff7e2);
    box-shadow:0 10px 26px rgba(245,166,35,.18);padding-top:18px;padding-bottom:17px;
  }
  .podium .pcard.p2{background:linear-gradient(180deg,#fcfdff,#f1f5fb);}
  .podium .pcard.p3{background:linear-gradient(180deg,#fffaf6,#fdf1e8);}
  .pcard .pos{
    font-family:var(--display);font-weight:800;font-size:clamp(13px,1vw,17px);letter-spacing:2px;
    color:var(--muted);text-transform:uppercase;
  }
  .pcard.p1 .pos{color:#c07f0a;} .pcard.p3 .pos{color:#b35f25;}
  .pcard .medal{font-size:clamp(36px,3.2vw,54px);line-height:1.1;}
  .pcard.p1 .medal{font-size:clamp(48px,4.4vw,72px);}
  .pcard .pname{font-weight:900;font-size:clamp(22px,2.1vw,36px);line-height:1.05;margin:4px 0 6px;word-break:break-all;}
  .pcard.p1 .pname{font-size:clamp(30px,2.9vw,48px);}
  .pcard .ptime{
    font-family:var(--mono);font-weight:700;font-size:clamp(22px,2vw,34px);color:var(--blue-600);
  }
  .pcard.p1 .ptime{font-size:clamp(30px,2.6vw,44px);color:#b97a09;}
  .pcard .stripe{position:absolute;top:0;left:0;right:0;height:5px;}
  .pcard.p1 .stripe{background:linear-gradient(90deg,#f5a623,#ffd76e);}
  .pcard.p2 .stripe{background:linear-gradient(90deg,#98a6b8,#c6d2de);}
  .pcard.p3 .stripe{background:linear-gradient(90deg,#d97b3f,#efa977);}
  .pcard.empty-p{opacity:.45;}
  .pcard .ptime.none{color:#aab9cf;font-family:var(--body);font-weight:600;font-size:clamp(15px,1.3vw,20px);}

  /* ============ RANKING ============ */
  .rank-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:10px 18px 18px;align-content:start;}
  @media(max-width:1100px){.rank-grid{grid-template-columns:1fr;} .podium{grid-template-columns:1fr;align-items:stretch;}}
  table{width:100%;border-collapse:collapse;font-size:clamp(16px,1.2vw,20px);}
  thead th{
    background:linear-gradient(120deg,var(--navy-900),var(--navy-700));
    color:#dce9ff;font-family:var(--display);font-size:clamp(12px,1vw,15px);font-weight:700;letter-spacing:1.2px;
    padding:12px 6px;text-align:center;text-transform:uppercase;
  }
  thead th:first-child{border-radius:9px 0 0 0;}
  thead th:last-child{border-radius:0 9px 0 0;}
  tbody td{padding:7px 6px;text-align:center;border-bottom:1px solid #eaf0f8;vertical-align:middle;}
  tbody tr:not(.empty):hover td{background:#f6f9ff;}
  tbody tr.empty td{color:#c3cfdf;}
  .rankbadge{
    width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:800;font-size:18px;color:#fff;
    background:linear-gradient(140deg,var(--blue-500),var(--navy-700));
  }
  .rankbadge.r1{background:linear-gradient(140deg,#ffc24d,var(--gold));box-shadow:0 0 0 3px #ffeec9;}
  .rankbadge.r2{background:linear-gradient(140deg,#b9c5d4,var(--silver));box-shadow:0 0 0 3px #e9eef4;}
  .rankbadge.r3{background:linear-gradient(140deg,#eb9a60,var(--bronze));box-shadow:0 0 0 3px #f8e2d2;}
  .rankbadge.empty{background:transparent;color:#c9d6e6;border:2px dashed #dde7f2;}
  .team{font-weight:800;text-align:left;padding-left:12px;font-size:clamp(17px,1.3vw,22px);}
  .rec{
    font-family:var(--mono);font-weight:700;font-size:clamp(16px,1.2vw,20px);
    padding:7px 9px;border-radius:8px;background:#eef4ff;color:var(--navy-700);
    display:inline-block;min-width:96px;border:1px solid transparent;
  }
  .rec.none{background:#f0f3f8;color:#9aabc2;font-family:var(--body);font-weight:600;font-size:14px;}
  .rec.best{background:linear-gradient(120deg,#e2f6ff,#e8f0ff);color:var(--blue-600);border-color:#9fd8f5;}
  .rec.placeholder{background:transparent;border:1px dashed #dee8f3;color:#c9d6e6;min-width:80px;}
  .acts{display:inline-flex;gap:5px;}
  .acts button{width:31px;height:31px;border-radius:8px;font-weight:900;font-size:14px;color:#fff;transition:.12s;}
  .acts .e{background:var(--blue-500);} .acts .r{background:var(--gold);} .acts .d{background:var(--danger);}
  .acts button:hover{filter:brightness(1.12);transform:translateY(-1px);}
  td .edit-in{width:84px;padding:6px;border-radius:7px;border:1px solid var(--blue-400);font-family:var(--mono);font-size:13px;text-align:center;}
  td .edit-name{width:98px;padding:6px;border-radius:7px;border:1px solid var(--blue-400);font-size:14px;}

  /* ============ PRESENT MODE : poster stage ============ */
  body.present{
    background:
      radial-gradient(800px 320px at 85% 0%, rgba(30,200,255,.16), transparent),
      radial-gradient(700px 300px at 5% 10%, rgba(43,109,255,.14), transparent),
      linear-gradient(160deg,var(--navy-950),var(--navy-900) 70%,var(--navy-800));
  }
  body.present .wrap{grid-template-columns:1fr;max-width:1880px;}
  body.present .control-card{display:none;}
  body.present .toolbar .op-only{display:none;}
  body.present .toolbar button.primary{box-shadow:0 0 22px rgba(30,200,255,.4);}
  body.present table{font-size:clamp(15px,1.8vw,25px);}
  body.present thead th{padding:17px 10px;font-size:clamp(12px,1.2vw,17px);}
  body.present tbody td{padding:14px 10px;}
  body.present .rankbadge{width:clamp(34px,3.6vw,46px);height:clamp(34px,3.6vw,46px);font-size:clamp(15px,1.8vw,21px);}
  body.present .rec{font-size:clamp(14px,1.7vw,23px);min-width:auto;}
  body.present .acts,body.present .actions-col{display:none;}
  body.present .pcard .pname{font-size:clamp(16px,1.8vw,24px);}
  body.present .pcard.p1 .pname{font-size:clamp(19px,2.2vw,30px);}
  body.present .pcard .ptime{font-size:clamp(16px,1.8vw,24px);}
  body.present .pcard.p1 .ptime{font-size:clamp(20px,2.4vw,32px);}

  /* step chip */
  .card-h .step{
    font-size:10px;letter-spacing:1px;color:#fff;background:linear-gradient(120deg,var(--blue-600),var(--cyan-400));
    padding:2px 8px;border-radius:6px;font-weight:800;
  }
  /* team registration */
  .add-row{display:flex;gap:8px;}
  .add-row input{flex:1;}
  .add-btn-sm{
    flex:0 0 auto;padding:0 16px;border-radius:9px;color:#fff;font-weight:800;font-size:14px;
    font-family:var(--display);letter-spacing:1px;white-space:nowrap;
    background:linear-gradient(120deg,var(--blue-600),var(--cyan-400));
    box-shadow:0 4px 12px rgba(20,86,232,.28);transition:.15s;
  }
  .add-btn-sm:hover{filter:brightness(1.07);transform:translateY(-1px);}
  .link-toggle{
    background:none;color:var(--blue-600);font-size:12px;font-weight:700;padding:8px 0 4px;
    margin-top:2px;
  }
  .link-toggle:hover{text-decoration:underline;}
  .manual-fields{margin-top:6px;}
  .team-count{
    margin-top:8px;font-family:var(--display);font-size:11px;letter-spacing:1px;
    color:var(--muted);text-transform:uppercase;
  }
  /* current racer bar */
  .current-bar{
    margin-bottom:14px;padding:12px;border-radius:10px;
    background:linear-gradient(120deg,#eef4ff,#e7f6ff);border:1px solid #bfe0f5;
  }
  .cb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .cb-label{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:1px;color:var(--navy-800);}
  .next-badge{
    font-family:var(--display);font-size:11px;font-weight:800;letter-spacing:.5px;
    padding:3px 10px;border-radius:999px;color:#fff;background:var(--silver);text-transform:uppercase;
  }
  .next-badge.a1{background:linear-gradient(120deg,var(--green),#15d182);}
  .next-badge.a2{background:linear-gradient(120deg,var(--blue-600),var(--cyan-400));}
  .next-badge.done{background:var(--silver);}
  .current-bar select{
    width:100%;padding:11px;border-radius:9px;border:1px solid var(--line-2);background:#fff;
    color:var(--ink);font-size:15px;font-weight:700;
  }
  /* auto toggle switch */
  .auto-toggle{
    display:flex;align-items:center;gap:10px;margin:14px 0 4px;cursor:pointer;
    font-size:13px;font-weight:700;color:var(--navy-800);
  }
  .auto-toggle input{position:absolute;opacity:0;width:0;height:0;}
  .auto-toggle .track{
    flex:0 0 auto;width:42px;height:23px;border-radius:999px;background:#c4d2e4;position:relative;transition:.2s;
  }
  .auto-toggle .thumb{
    position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s;
  }
  .auto-toggle input:checked + .track{background:linear-gradient(120deg,var(--green),#15d182);}
  .auto-toggle input:checked + .track .thumb{transform:translateX(19px);}
  .auto-toggle input:focus-visible + .track{box-shadow:0 0 0 3px rgba(43,109,255,.3);}

  /* ===== LEFT : 2-track timers (full height) ===== */
  .control-card .sw-body{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px;}
  .control-top{display:flex;gap:12px;}
  .control-top button{font-family:var(--display);font-weight:800;letter-spacing:1px;border-radius:12px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:10px;}
  .control-top kbd{

  /* 동시 출발 = 레드→오렌지 (출발 신호처럼 확 눈에 띄게) */

<script>
"use strict";
/* ======================= 시간 유틸 ======================= */
// 콜론(:)이 있으면 분:초.밀리, 없으면 순수 '초'(소수 허용)
function parseTime(raw){
  if(raw==null) return null;
  let s=String(raw).trim();
  if(s==="") return null;
  s=s.replace(/\s/g,"");
  let m;
  if((m=/^(\d{1,3}):([0-5]?\d)(?:[.,](\d{1,3}))?$/.exec(s))){
    const min=+m[1], sec=+m[2];
    const frac=m[3]?+("0."+m[3]):0;
    return min*60000 + sec*1000 + Math.round(frac*1000);
  }
  if((m=/^(\d+)(?:[.,](\d{1,3}))?$/.exec(s))){
    const sec=+m[1];
    const frac=m[2]?+("0."+m[2]):0;
    return Math.round((sec+frac)*1000);
  }
  return NaN;
}
function formatTime(ms){
  if(ms==null) return null;
  const total=Math.max(0,Math.round(ms));
  const min=Math.floor(total/60000);
  const sec=Math.floor((total%60000)/1000);
  const mmm=total%1000;
  return String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0")+"."+String(mmm).padStart(3,"0");
}
function bestOf(a,b){
  const vals=[a,b].filter(v=>typeof v==="number" && !isNaN(v));
  if(vals.length===0) return null;
  return Math.min(...vals);
}

/* ======================= 상태 ======================= */
const LS_KEY="seame2026.teams";
let teams=[]; let nextId=1;

function load(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){
      const data=JSON.parse(raw);
      teams=Array.isArray(data.teams)?data.teams:[];
      nextId=data.nextId||(teams.reduce((mx,t)=>Math.max(mx,t.id),0)+1);
    }
  }catch(e){ console.warn("load failed",e); teams=[]; }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({teams,nextId})); }
  catch(e){ console.warn("save failed",e); }
}

/* ======================= 랭킹 정렬 ======================= */
function rankedTeams(){
  const withRec=[], without=[];
  teams.forEach((t,idx)=>{
    const best=bestOf(t.a1,t.a2);
    (best==null?without:withRec).push({t,best,idx});
  });
  withRec.sort((x,y)=> x.best-y.best || x.idx-y.idx);
  return withRec.concat(without).map(o=>o.t);
}

/* ======================= 렌더 ======================= */
const TOTAL_SLOTS=30, PER_COL=15;
const rankGrid=document.getElementById("rankGrid");
const podiumEl=document.getElementById("podium");

function recCell(ms,isBest){
  if(ms==null) return '<span class="rec none">기록 없음</span>';
  return '<span class="rec'+(isBest?' best':'')+'">'+formatTime(ms)+'</span>';
}
function placeholderCell(){ return '<span class="rec placeholder">–</span>'; }

function renderPodium(ranked){
  if(!podiumEl) return;            // 메인 화면에서는 포디움 미표시(순위표가 한눈에)
  const order=[1,0,2]; // P2 P1 P3 layout
  const cls=["p2","p1","p3"];
  const label=["P2","P1","P3"];
  const medal=["🥈","🥇","🥉"];
  podiumEl.innerHTML=order.map((ri,i)=>{
    const t=ranked[ri];
    const best=t?bestOf(t.a1,t.a2):null;
    if(t && best!=null){
      return '<div class="pcard '+cls[i]+'"><div class="stripe"></div>'+
        '<div class="pos">'+label[i]+'</div><div class="medal">'+medal[i]+'</div>'+
        '<div class="pname">'+escapeHtml(t.name)+'</div>'+
        '<div class="ptime">'+formatTime(best)+'</div></div>';
    }
    return '<div class="pcard '+cls[i]+' empty-p"><div class="stripe"></div>'+
      '<div class="pos">'+label[i]+'</div><div class="medal">'+medal[i]+'</div>'+
      '<div class="pname">–</div><div class="ptime none">대기 중</div></div>';
  }).join("");
}

function render(){
  const ranked=rankedTeams();
  renderPodium(ranked);
  const cols=[[],[]];
  for(let i=0;i<TOTAL_SLOTS;i++){
    const colIdx=i<PER_COL?0:1;
    const rankNo=i+1;
    const t=ranked[i];
    if(t){
      const best=bestOf(t.a1,t.a2);
      const a1best = best!=null && t.a1===best;
      const a2best = best!=null && t.a2===best;
      const medal = rankNo===1?' 🥇':rankNo===2?' 🥈':rankNo===3?' 🥉':'';
      cols[colIdx].push(
        '<tr data-id="'+t.id+'">'+
          '<td><span class="rankbadge r'+(rankNo<=3?rankNo:'')+'">'+rankNo+'</span></td>'+
          '<td class="team">'+escapeHtml(t.name)+medal+'</td>'+
          '<td>'+recCell(t.a1,a1best)+'</td>'+
          '<td>'+recCell(t.a2,a2best)+'</td>'+
          '<td>'+(best==null?'<span class="rec none">–</span>':'<span class="rec best">'+formatTime(best)+'</span>')+'</td>'+
          '<td class="actions-col"><span class="acts"><button class="e" title="수정" data-act="edit" data-id="'+t.id+'">E</button>'+
            '<button class="r" title="기록 초기화" data-act="resetrec" data-id="'+t.id+'">R</button>'+
            '<button class="d" title="삭제" data-act="del" data-id="'+t.id+'">D</button></span></td>'+
        '</tr>'
      );
    }else{
      cols[colIdx].push(
        '<tr class="empty">'+
          '<td><span class="rankbadge empty">'+rankNo+'</span></td>'+
          '<td>–</td><td>'+placeholderCell()+'</td><td>'+placeholderCell()+'</td>'+
          '<td>'+placeholderCell()+'</td><td class="actions-col">–</td>'+
        '</tr>'
      );
    }
  }
  rankGrid.innerHTML = cols.map(rows=>tableHtml(rows.join(""))).join("");
  refreshApplySelect();
  save();
}
function tableHtml(body){
  return '<table><thead><tr>'+
    '<th>Rank</th><th>Team Name</th><th>1st Record</th><th>2nd Record</th><th>Best Time</th><th class="actions-col">Actions</th>'+
    '</tr></thead><tbody>'+body+'</tbody></table>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ======================= 팀 이름 → 찾기/생성 ======================= */
function findTeam(name){
  name=(name||"").trim();
  if(!name) return null;
  return teams.find(t=>t.name.toLowerCase()===name.toLowerCase())||null;
}
function findOrCreateTeam(name){
  name=(name||"").trim();
  if(!name) return null;
  let t=findTeam(name);
  if(!t){ t={id:nextId++,name,a1:null,a2:null}; teams.push(t); }
  return t;
}

/* ======================= 수정 / 기록초기화 / 삭제 ======================= */
rankGrid.addEventListener("click",e=>{
  const btn=e.target.closest("button[data-act]");
  if(!btn) return;
  const id=+btn.dataset.id, act=btn.dataset.act;
  if(act==="del") deleteTeam(id);
  else if(act==="edit") startEdit(id);
  else if(act==="save") commitEdit(id);
  else if(act==="cancel") render();
  else if(act==="resetrec") resetTeamRecords(id);
});
function deleteTeam(id){
  const t=teams.find(x=>x.id===id);
  if(!t) return;
  if(!confirm("'"+t.name+"' 팀을 삭제할까요?")) return;
  teams=teams.filter(x=>x.id!==id);
  render(); toast("삭제됨");
}
function resetTeamRecords(id){
  const t=teams.find(x=>x.id===id);
  if(!t) return;
  if(t.a1==null && t.a2==null){ toast("'"+t.name+"' 기록이 이미 없습니다"); return; }
  if(!confirm("'"+t.name+"' 의 1·2차 기록을 모두 지울까요? (팀은 유지)")) return;
  const pa1=t.a1, pa2=t.a2;
  t.a1=null; t.a2=null;
  render();
  toast("'"+t.name+"' 기록 초기화", ()=>{ t.a1=pa1; t.a2=pa2; render(); toast("'"+t.name+"' 기록 복원"); });
}
function startEdit(id){
  const t=teams.find(x=>x.id===id);
  if(!t) return;
  const tr=rankGrid.querySelector('tr[data-id="'+id+'"]');
  if(!tr) return;
  const cells=tr.children;
  cells[1].innerHTML='<input class="edit-name" value="'+escapeHtml(t.name)+'">';
  cells[2].innerHTML='<input class="edit-in" data-k="a1" value="'+(t.a1!=null?formatTime(t.a1):"")+'" placeholder="기록 없음">';
  cells[3].innerHTML='<input class="edit-in" data-k="a2" value="'+(t.a2!=null?formatTime(t.a2):"")+'" placeholder="기록 없음">';
  cells[5].innerHTML='<span class="acts"><button class="e" data-act="save" data-id="'+id+'">✓</button>'+
                     '<button class="d" data-act="cancel" data-id="'+id+'">✕</button></span>';
  const nameInput=cells[1].querySelector("input"); nameInput.focus(); nameInput.select();
  tr.querySelectorAll("input").forEach(inp=>inp.addEventListener("keydown",ev=>{
    if(ev.key==="Enter")commitEdit(id); if(ev.key==="Escape")render();
  }));
}
function commitEdit(id){
  const t=teams.find(x=>x.id===id);
  if(!t) return;
  const tr=rankGrid.querySelector('tr[data-id="'+id+'"]');
  const name=tr.querySelector(".edit-name").value.trim();
  if(!name){alert("팀 이름은 비울 수 없습니다.");return;}
  const fields=tr.querySelectorAll(".edit-in");
  const parsed={};
  for(const f of fields){
    const v=f.value.trim();
    if(v===""){parsed[f.dataset.k]=null;continue;}
    const ms=parseTime(v);
    if(isNaN(ms)){alert("기록 형식 오류: "+v);return;}
    parsed[f.dataset.k]=ms;
  }
  t.name=name; t.a1=parsed.a1; t.a2=parsed.a2;
  render(); toast("수정됨");
}

/* ======================= 2트랙 타이머 ======================= */
const autoRecord=document.getElementById("autoRecord");
const teamCountEl=document.getElementById("teamCount");
const slotName={a1:"1차",a2:"2차"};

function nextSlot(t){ if(!t) return null; if(t.a1==null) return "a1"; if(t.a2==null) return "a2"; return null; }

// 기록 쓰기 + 되돌리기 (타이머 리셋은 호출 측에서 처리)
function writeRecord(t, slot, ms){
  const prev=t[slot];
  t[slot]=ms;
  render();
  toast(t.name+" "+slotName[slot]+" 기록 저장 · "+formatTime(ms), ()=>{
    t[slot]=prev; render(); toast(t.name+" "+slotName[slot]+" 기록 되돌림");
  });
}

// 한 트랙(레인) 타이머 — 팀 이름 입력칸 기반
function makeLane(o){
  const laneEl=document.getElementById(o.lane),
        disp=document.getElementById(o.disp),
        toggleEl=document.getElementById(o.toggle),
        resetEl=document.getElementById(o.reset),
        inp=document.getElementById(o.input),
        badge=document.getElementById(o.badge);
  let start=0, elapsed=0, running=false, raf=null;
  const cur=()=>elapsed + (running?(performance.now()-start):0);
  function renderTime(){
    const ms=cur();
    const min=Math.floor(ms/60000), sec=Math.floor((ms%60000)/1000), ds=Math.floor((ms%1000)/100);
    disp.innerHTML=String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0")+'<span class="cs">.'+ds+'</span>';
  }
  function updateBadge(){
    const name=inp.value.trim();
    if(!name){ badge.textContent="팀 입력"; badge.className="next-badge"; return; }
    const t=findTeam(name);
    const slot = t ? nextSlot(t) : "a1";
    if(slot){ badge.textContent="다음 ▶ "+slotName[slot]; badge.className="next-badge "+slot; }
    else { badge.textContent="완료"; badge.className="next-badge done"; }
  }
  function loop(){ if(running){ renderTime(); raf=requestAnimationFrame(loop); } }
  function startFn(){
    if(running) return;
    running=true; start=performance.now();
    toggleEl.textContent="■ 정지"; toggleEl.classList.add("stopping");
    laneEl.classList.add("running");
    loop();
  }
  function stopFn(){
    if(!running) return;
    elapsed=cur(); running=false; cancelAnimationFrame(raf);
    toggleEl.textContent="시작"; toggleEl.classList.remove("stopping");
    laneEl.classList.remove("running");
    renderTime();
    autoRec();
  }
  function toggleFn(){ running?stopFn():startFn(); }
  function resetFn(){
    running=false; cancelAnimationFrame(raf); elapsed=0; start=0;
    toggleEl.textContent="시작"; toggleEl.classList.remove("stopping");
    laneEl.classList.remove("running");
    renderTime();
  }
  function autoRec(){
    if(!autoRecord.checked) return;
    const name=inp.value.trim();
    if(!name){ toast(o.label+"트랙: 팀 이름을 입력하세요"); return; }
    const ms=Math.round(cur()); if(ms<=0) return;
    const t=findOrCreateTeam(name);
    const slot=nextSlot(t);
    if(!slot){ toast(t.name+" 1·2차 모두 기록됨 — R 또는 E로 수정"); return; }
    writeRecord(t, slot, ms);
    resetFn();                                        // 자동 저장 후 이 트랙 0으로
  }
  function registerName(){                            // Enter → 명단에 추가
    const name=inp.value.trim();
    if(!name) return;
    const existed=!!findTeam(name);
    findOrCreateTeam(name);
    render();
    if(!existed) toast("'"+name+"' 등록됨");
  }
  toggleEl.addEventListener("click", toggleFn);
  resetEl.addEventListener("click", resetFn);
  inp.addEventListener("input", updateBadge);
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") registerName(); });
  renderTime();
  return {startFn, stopFn, toggleFn, resetFn, updateBadge};
}

const laneA=makeLane({lane:"laneA", disp:"dispA", toggle:"toggleA", reset:"resetA", input:"teamA", badge:"badgeA", label:"1"});
const laneB=makeLane({lane:"laneB", disp:"dispB", toggle:"toggleB", reset:"resetB", input:"teamB", badge:"badgeB", label:"2"});

// 팀 자동완성 목록(datalist) + 팀 수 + 배지
const teamlist=document.getElementById("teamlist");
function refreshApplySelect(){
  teamlist.innerHTML=teams.map(t=>'<option value="'+escapeHtml(t.name)+'">').join("");
  teamCountEl.textContent=teams.length?("· "+teams.length+"팀"):"";
  laneA.updateBadge(); laneB.updateBadge();
}

// 마스터: 동시 출발 / 둘 다 리셋
function startBoth(){ laneA.resetFn(); laneB.resetFn(); laneA.startFn(); laneB.startFn(); }
function resetBoth(){ laneA.resetFn(); laneB.resetFn(); }
document.getElementById("btnStartBoth").addEventListener("click", startBoth);
document.getElementById("btnResetBoth").addEventListener("click", resetBoth);

// 키보드: Space=동시 출발 · A=A 토글/정지 · L=B 토글/정지 · R=둘 다 리셋
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="select"||tag==="textarea") return;
  if(document.getElementById("ceremony").classList.contains("show")) return;
  if(e.code==="Space"){ e.preventDefault(); startBoth(); }
  else if(e.key==="a"||e.key==="A"){ laneA.toggleFn(); }
  else if(e.key==="l"||e.key==="L"){ laneB.toggleFn(); }
  else if(e.key==="r"||e.key==="R"){ resetBoth(); }
});

/* ======================= 발표 모드 ======================= */
const btnPresent=document.getElementById("btnPresent");
btnPresent.addEventListener("click",()=>{
  document.body.classList.toggle("present");
  const on=document.body.classList.contains("present");
  btnPresent.textContent=on?"🖥 운영 모드":"📺 발표 모드";
});

/* ======================= 백업/복원/내보내기 ======================= */
function download(filename, text, type){
  const blob=new Blob([text],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.getElementById("btnExportJson").addEventListener("click",()=>{
  download("seame2026_backup.json", JSON.stringify({teams,nextId},null,2),"application/json");
  toast("백업 파일 저장됨");
});
document.getElementById("btnExportCsv").addEventListener("click",()=>{
  const ranked=rankedTeams();
  const rows=[["순위","팀명","1차기록","2차기록","최고기록"]];
  ranked.forEach((t,i)=>{
    const best=bestOf(t.a1,t.a2);
    rows.push([
      i+1, t.name,
      t.a1!=null?formatTime(t.a1):"",
      t.a2!=null?formatTime(t.a2):"",
      best!=null?formatTime(best):""
    ]);
  });
  const csv="﻿"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  download("seame2026_results.csv", csv, "text/csv;charset=utf-8");
  toast("결과 CSV 저장됨");
});
document.getElementById("btnImport").addEventListener("click",()=>document.getElementById("fileImport").click());
document.getElementById("fileImport").addEventListener("change",e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data.teams)) throw new Error("형식 오류");
      if(!confirm("현재 데이터를 복원 파일로 덮어쓸까요?")) return;
      teams=data.teams; nextId=data.nextId||(teams.reduce((mx,t)=>Math.max(mx,t.id),0)+1);
      render(); toast("복원 완료 ("+teams.length+"팀)");
    }catch(err){ alert("복원 실패: "+err.message); }
  };
  reader.readAsText(file);
  e.target.value="";
});
document.getElementById("btnReset").addEventListener("click",()=>{
  if(!confirm("모든 팀 기록을 삭제할까요? 되돌릴 수 없습니다.")) return;
  if(!confirm("정말 전체 초기화하시겠습니까?")) return;
  teams=[]; nextId=1; render(); toast("전체 초기화 완료");
});

/* ======================= toast (옵션: 되돌리기) ======================= */
let toastTimer=null;
const toastEl=document.getElementById("toast"),
      toastMsg=document.getElementById("toastMsg"),
      toastUndo=document.getElementById("toastUndo");
let undoFn=null;
toastUndo.addEventListener("click",()=>{ if(undoFn){const f=undoFn; undoFn=null; f();} toastEl.classList.remove("show"); });
function toast(msg, onUndo){
  toastMsg.textContent=msg;
  undoFn=onUndo||null;
  toastUndo.classList.toggle("hidden", !onUndo);
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove("show"), onUndo?4500:1800);
}

/* ======================= 시상식 (팡파레 + 컨페티) ======================= */
const ceremony=document.getElementById("ceremony"),
      cerName=document.getElementById("cerName"),
      cerTime=document.getElementById("cerTime"),
      cerRunners=document.getElementById("cerRunners"),
      confettiCanvas=document.getElementById("confettiCanvas");
const cctx=confettiCanvas.getContext("2d");
let confettiParticles=[], confettiRAF=null, confettiUntil=0;
const CONFETTI_COLORS=["#f5a623","#ffd76e","#2b6dff","#1ec8ff","#19b56a","#ffffff","#4f8aff"];

function sizeCanvas(){
  confettiCanvas.width=window.innerWidth;
  confettiCanvas.height=window.innerHeight;
}
function spawnConfetti(burst){
  const W=confettiCanvas.width;
  for(let i=0;i<burst;i++){
    confettiParticles.push({
      x:Math.random()*W, y:-20-Math.random()*confettiCanvas.height*0.3,
      vx:(Math.random()-0.5)*5, vy:2+Math.random()*4,
      size:6+Math.random()*8, rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3,
      color:CONFETTI_COLORS[(i*7+((Math.random()*CONFETTI_COLORS.length)|0))%CONFETTI_COLORS.length],
      shape:Math.random()<0.5?"rect":"circle"
    });
  }
}
function confettiTick(){
  const W=confettiCanvas.width, H=confettiCanvas.height;
  cctx.clearRect(0,0,W,H);
  const now=performance.now();
  for(const p of confettiParticles){
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.vx*=0.99; p.rot+=p.vr;
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot); cctx.fillStyle=p.color;
    if(p.shape==="rect") cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    else { cctx.beginPath(); cctx.arc(0,0,p.size/2,0,Math.PI*2); cctx.fill(); }
    cctx.restore();
  }
  confettiParticles=confettiParticles.filter(p=>p.y<H+30);
  if(now<confettiUntil && confettiParticles.length<260 && Math.random()<0.5) spawnConfetti(10);
  if(confettiParticles.length>0 || now<confettiUntil){
    confettiRAF=requestAnimationFrame(confettiTick);
  } else { cctx.clearRect(0,0,W,H); confettiRAF=null; }
}
function startConfetti(){
  sizeCanvas();
  confettiUntil=performance.now()+5200;
  spawnConfetti(160);
  if(!confettiRAF) confettiTick();
}
window.addEventListener("resize",()=>{ if(ceremony.classList.contains("show")) sizeCanvas(); });

/* 팡파레 — Web Audio로 합성 (오프라인, 외부파일 불필요) */
let audioCtx=null;
function playFanfare(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    const t0=audioCtx.currentTime;
    // 승리 팡파레: G4 G4 G4 C5 ... E5 G5(롱)
    const seq=[
      {f:392.00,t:0.00,d:0.16},{f:392.00,t:0.16,d:0.16},{f:392.00,t:0.32,d:0.16},
      {f:523.25,t:0.50,d:0.42},
      {f:392.00,t:0.95,d:0.16},{f:523.25,t:1.12,d:0.16},
      {f:659.25,t:1.30,d:0.55},
      {f:783.99,t:1.85,d:0.85}
    ];
    seq.forEach(n=>{
      ["sawtooth","square"].forEach((type,idx)=>{
        const o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.type=type; o.frequency.value=n.f*(idx?1.001:1);
        const start=t0+n.t, end=start+n.d;
        g.gain.setValueAtTime(0,start);
        g.gain.linearRampToValueAtTime(idx?0.06:0.14, start+0.02);
        g.gain.exponentialRampToValueAtTime(0.0008, end);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(start); o.stop(end+0.05);
      });
    });
    // 베이스 깔기
    const bass=audioCtx.createOscillator(), bg=audioCtx.createGain();
    bass.type="triangle"; bass.frequency.setValueAtTime(130.81,t0); bass.frequency.setValueAtTime(196.00,t0+1.30);
    bg.gain.setValueAtTime(0.0,t0); bg.gain.linearRampToValueAtTime(0.10,t0+0.05);
    bg.gain.exponentialRampToValueAtTime(0.0008,t0+2.7);
    bass.connect(bg); bg.connect(audioCtx.destination); bass.start(t0); bass.stop(t0+2.75);
  }catch(e){ console.warn("fanfare failed",e); }
}

function runCeremony(){
  startConfetti();
  playFanfare();
}
function openCeremony(){
  const ranked=rankedTeams().filter(t=>bestOf(t.a1,t.a2)!=null);
  if(ranked.length===0){ toast("기록이 있는 팀이 없습니다 — 먼저 기록을 입력하세요"); return; }
  const champ=ranked[0];
  cerName.textContent=champ.name;
  cerTime.textContent=formatTime(bestOf(champ.a1,champ.a2));
  const medals=["🥈","🥉"];
  cerRunners.innerHTML=ranked.slice(1,3).map((t,i)=>
    '<div class="cer-run"><div class="rk">'+medals[i]+' '+(i+2)+'위</div>'+
    '<div class="nm">'+escapeHtml(t.name)+'</div>'+
    '<div class="tm">'+formatTime(bestOf(t.a1,t.a2))+'</div></div>'
  ).join("");
  ceremony.classList.add("show");
  runCeremony();
}
function closeCeremony(){
  ceremony.classList.remove("show");
  confettiUntil=0;
  if(confettiRAF){ cancelAnimationFrame(confettiRAF); confettiRAF=null; }
  confettiParticles=[]; cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
}
document.getElementById("btnCeremony").addEventListener("click",openCeremony);
document.getElementById("cerClose").addEventListener("click",closeCeremony);
document.getElementById("cerReplay").addEventListener("click",runCeremony);
ceremony.addEventListener("click",e=>{ if(e.target===ceremony) closeCeremony(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && ceremony.classList.contains("show")) closeCeremony(); });

/* ======================= init ======================= */
load();
render();
</script>
